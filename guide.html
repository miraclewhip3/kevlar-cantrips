<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kevlar & Cantrips Guide</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e131d'/><path d='M16 4 L27 8 V16 C27 22 22 26.5 16 28.5 C10 26.5 5 22 5 16 V8 Z' fill='%23243049' stroke='%23f0b23c' stroke-width='2'/><rect x='10.5' y='10.5' width='11' height='11' rx='2.5' fill='%23e4e8f0'/><circle cx='13.5' cy='13.5' r='1.4' fill='%230e131d'/><circle cx='18.5' cy='18.5' r='1.4' fill='%230e131d'/><path d='M22 4 L19 10 H23 L20 16' stroke='%23c77dff' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0e131d; --panel:#161e2c; --panel2:#1f2a3d; --line:#2e3b54; --fg:#e4e8f0; --muted:#8e9ab3;
  --hud:#f0b23c; --hud-dim:#6e5420; --arcane:#c77dff; --arcane-dim:#4b2f6b;
  --ally:#5aa9ff; --foe:#ff6b5b; --ok:#5fd28a;
  --dmg:#ff8a73; --ward:#7fb2ff; --heal:#7be39a; --pierce:#ffd166; --arc:#9be7ff; --chg:#d4a8ff; --stun:#ffb3e6; --sight:#7fe0d0; --blk:#68748c;
  --display:"Chakra Petch","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.4;min-height:100vh}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:.02em}
h2{font-size:1.45rem;color:var(--hud)}
h3{font-size:1.1rem}
h4{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:10px 16px 40px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{font:700 .9rem var(--display);letter-spacing:.04em;background:var(--hud);color:#231702;border:0;border-radius:4px;padding:.45rem .95rem;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{font-size:.78rem;padding:.25rem .6rem}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:4px;width:2.1rem;height:2.1rem;font-size:1rem;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hud);outline-offset:2px}
input{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:.4rem .6rem}
.tag{display:inline-block;font:600 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--panel2);color:var(--muted)}
.chip{font:600 .78rem var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 9px;white-space:nowrap}
.chip.hud{color:var(--hud);border-color:var(--hud-dim)}
.chip.arc{color:var(--arcane);border-color:var(--arcane-dim);cursor:help}
.banner{background:#2a2412;border:1px solid var(--hud-dim);color:#ffe7b3;padding:.35rem .8rem;border-radius:4px;font-size:.9rem}
.err{color:var(--foe)}

/* faces + dice */
.f{display:inline-flex;align-items:center;justify-content:center;gap:1px;min-width:1.9rem;height:1.6rem;padding:0 4px;border-radius:4px;background:#0b1018;border:1px solid var(--line);font:700 .78rem var(--mono);cursor:help}
.f-D{color:var(--dmg)}.f-W{color:var(--ward)}.f-H{color:var(--heal)}.f-R{color:var(--pierce)}.f-A{color:var(--arc)}.f-C{color:var(--chg)}.f-S{color:var(--stun)}.f-E{color:var(--sight)}.f-B{color:var(--blk)}.f-U{color:var(--hud)}.f-X{color:var(--dmg)}
.faces{display:flex;gap:3px;flex-wrap:wrap}
.facepick .f{cursor:pointer}.facepick .f:hover{outline:2px solid var(--hud)}
.facepick .f.no{opacity:.35;cursor:not-allowed;outline:none}
.die{width:3.7rem;height:3.7rem;border-radius:9px;background:linear-gradient(160deg,#eef1f6,#c9d0dc);color:#1b2230;display:flex;align-items:center;justify-content:center;gap:2px;font:800 1.2rem var(--mono);border:2px solid #9aa5b8;box-shadow:0 3px 0 #5d6779;position:relative;user-select:none;flex:none;transition:transform .12s}
.die.f-D{color:#c4361f}.die.f-W{color:#2862c4}.die.f-H{color:#1f8f44}.die.f-R{color:#a86f00}.die.f-A{color:#0a7ea0}.die.f-C{color:#7440c9}.die.f-S{color:#b0287a}.die.f-E{color:#0f7c8c}.die.f-B{color:#8892a3}
.die.mine{cursor:pointer}
.die.kept{border-color:var(--hud);box-shadow:0 0 0 3px var(--hud),0 3px 0 #5d6779;transform:translateY(-2px)}
/* locked dice: a padlock badge and a gold frame, so it's obvious which dice a reroll will skip */
.die .lock{position:absolute;top:-10px;left:-10px;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--hud);color:#231702;display:flex;align-items:center;justify-content:center;font-size:.85rem;box-shadow:0 1px 3px #0008}
.die.mine.unlocked{outline:2px dashed rgba(240,178,60,.55);outline-offset:3px}
.lockhint{font:700 .68rem var(--mono);letter-spacing:.06em;text-align:center;min-height:.9rem}
.lockhint.on{color:var(--hud)}.lockhint.off{color:var(--muted)}
.die.sel{box-shadow:0 0 0 4px #fff,0 3px 0 #5d6779;transform:scale(1.06)}
.die.used{opacity:.55}
.die.empty{background:#1b2436;border-color:var(--line);box-shadow:none;color:var(--muted);font-size:.9rem}
.die.roll{animation:roll .42s ease-out}
@keyframes roll{0%{transform:rotate(-25deg) scale(.75)}60%{transform:rotate(10deg) scale(1.06)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
.die .gears{position:absolute;top:-8px;right:-8px;display:flex;gap:2px}
.die .gear{width:1.35rem;height:1.35rem;border-radius:50%;background:var(--panel2);border:1px solid #7fd3e6;display:flex;align-items:center;justify-content:center;font-size:.7rem}
.die em.kws{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:700 .72rem var(--mono);font-style:normal;color:#6a2ea3;letter-spacing:2px;line-height:1}
.foe .die em.kws{color:var(--arcane)}
.f{position:relative;height:2.3rem;min-width:2.5rem;align-items:flex-start;justify-content:flex-start;padding:3px 0 0 5px}
.f .ico{font-size:1.15rem;margin:0}
.f .kwg{position:absolute;bottom:1px;left:0;right:0;text-align:center;font:700 .7rem/1 var(--mono);font-style:normal;color:var(--arcane);letter-spacing:1px}
.psnb{font:700 .7rem var(--mono);color:#9be37b}
.log tr.sys td{color:var(--hud);font:600 .72rem var(--mono);letter-spacing:.08em;padding-top:8px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.topbar .title{font-family:var(--display);font-size:1.15rem;color:var(--hud);display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}

/* enemies */
.enemyrow{display:flex;gap:12px;flex-wrap:wrap}
.foe{background:var(--panel);border:1px solid #4a2b30;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:7px;align-items:center;width:10rem;position:relative}
.foe.boss{width:13rem;border-color:#7a2b2b;background:#1d1519}
.foe.dead{opacity:.3;filter:grayscale(1)}
.foe .nm{font:600 .9rem var(--display);text-align:center;line-height:1.1}
.foe .ic{font-size:1.3rem}
.foe .ints{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.foe .int{display:flex;flex-direction:column;align-items:center;gap:2px}
.foe .die{width:2.9rem;height:2.9rem;font-size:.95rem;background:linear-gradient(160deg,#3a2226,#2a181b);border-color:#6b3a3f;box-shadow:0 2px 0 #1b0f11;color:var(--dmg)}
.foe .die.f-W{color:var(--ward)}.foe .die.f-H{color:var(--heal)}.foe .die.f-U{color:var(--hud)}.foe .die.f-B{color:var(--blk);font-size:1.4rem}
.foe .die.stun{opacity:.35}
.foe .to{font:500 .7rem var(--mono);color:var(--muted)}
.foe .inc{font:600 .72rem var(--mono);color:var(--hud);min-height:1rem;text-align:center}
.hp{width:100%;height:.95rem;background:#0b1018;border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#b8432f,#ff6b5b);transition:width .3s}
.hp.ally i{background:linear-gradient(90deg,#2f7bb8,#5aa9ff)}
.hp span{position:relative;display:block;width:fit-content;margin:0 auto;padding:0 5px;border-radius:3px;background:rgba(8,12,18,.78);color:#fff;text-shadow:0 1px 2px #000;font:700 .66rem/.85rem var(--mono)}
.wardb{font:700 .7rem var(--mono);color:var(--ward)}
.stunb{font:700 .7rem var(--mono);color:var(--stun)}
.tg-ok{border-color:var(--hud)!important;box-shadow:0 0 0 2px var(--hud-dim);cursor:crosshair}
.tg-ok:hover{background:#221d10}

/* squad */
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.op{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.op.me{border-color:var(--arcane);box-shadow:0 0 0 1px var(--arcane-dim)}
.op.down{opacity:.55}
.op .ctrlwrap{display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed var(--line)}
.op .ctrl{gap:8px;min-height:2.2rem}
.op .ctrlwrap .hint{font-size:.85rem;min-height:0}
.op .hh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.op .hh b{font-family:var(--display);font-size:1.05rem}
.op .sub{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.op .dice{display:flex;gap:12px;flex-wrap:nowrap;min-height:5.2rem}
.op .dcol{display:flex;flex-direction:column;align-items:center;gap:4px;width:5rem}
.op .tg{font:500 .68rem var(--mono);color:var(--muted);text-align:center;line-height:1.2;min-height:.85rem}
.dname{font:600 .7rem var(--mono);color:var(--muted);background:none;border:0;border-bottom:1px dashed var(--line);cursor:pointer;padding:0;text-align:center;line-height:1.2}
.dname:hover{color:var(--fg);border-color:var(--hud)}
/* unfolded die: top, a row of four, bottom */
.net{display:grid;grid-template-columns:repeat(4,var(--s,3rem));grid-auto-rows:var(--s,3rem);gap:5px}
.net .nf{border-radius:8px;background:linear-gradient(160deg,#eef1f6,#c9d0dc);border:2px solid var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 calc(var(--s,3rem) * .32) var(--mono);color:#1b2230;position:relative;cursor:help}
.die{--s:3.7rem}.foe .die{--s:2.9rem}.f{--s:2.1rem}
.ico{font-size:calc(var(--s,3rem) * .64);line-height:1;margin-right:calc(var(--s,3rem) * .14);font-style:normal}
.ico svg{width:1em;height:1em;display:block}
.portrait{display:block;flex:none;border-radius:10px}
.tower{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.pips{position:absolute;right:calc(var(--s,3rem) * .08);bottom:calc(var(--s,3rem) * .14);display:flex;gap:calc(var(--s,3rem) * .05);align-items:flex-end;font-style:normal}
.pips .ticks{display:flex;flex-direction:column-reverse;gap:calc(var(--s,3rem) * .05)}
.pips b{display:block;width:calc(var(--s,3rem) * .13);height:calc(var(--s,3rem) * .08);background:currentColor;border-radius:1px}
.pips b.p5{height:calc(var(--s,3rem) * .52)}
.f .pips{bottom:3px;right:3px}
.f .pips b{min-width:2px;min-height:2px}
.net .nf.f-D{color:#c4361f}.net .nf.f-W{color:#2862c4}.net .nf.f-H{color:#1f8f44}.net .nf.f-R{color:#a86f00}.net .nf.f-A{color:#0a7ea0}.net .nf.f-C{color:#7440c9}.net .nf.f-S{color:#b0287a}.net .nf.f-E{color:#0f7c8c}.net .nf.f-B{color:#8892a3}
.net .nf .kwg{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:700 calc(var(--s,3rem) * .25) var(--mono);font-style:normal;color:#6a2ea3;letter-spacing:1px;line-height:1}
.net .p0{grid-area:1/2}.net .p1{grid-area:2/1}.net .p2{grid-area:2/2}.net .p3{grid-area:2/3}.net .p4{grid-area:2/4}.net .p5{grid-area:3/2}
.netwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.upnet{align-items:stretch}
.uparrow{align-self:center;font:700 2.2rem/1 var(--display);color:var(--hud)}
.upor{align-self:center;font:700 .9rem var(--display);color:var(--muted);text-transform:uppercase}
.mydie.chosen{border-color:var(--hud);box-shadow:0 0 0 1px var(--hud)}
@media (max-width:640px){.upnet{flex-direction:column;align-items:center}.uparrow{transform:rotate(90deg)}}
.op .badges{display:flex;gap:4px;flex-wrap:wrap;min-height:1.2rem}
.bdg{font:700 .7rem var(--mono);padding:1px 6px;border-radius:3px;background:#0b1018;border:1px solid var(--line)}
.bdg.D{color:var(--dmg);border-color:#6b3329}.bdg.W{color:var(--ward)}.bdg.H{color:var(--heal)}
.status{font:700 .7rem var(--mono);letter-spacing:.08em}
.status.ready{color:var(--ok)}.status.roll,.status.aim{color:var(--hud)}.status.down,.status.gone{color:var(--foe)}
.sigbtn{font:700 .78rem var(--display);background:#2d2350;color:#e2d4ff;border:1px solid #5a4796;border-radius:4px;padding:.3rem .6rem;cursor:pointer;align-self:flex-start}
.sigbtn.on{background:var(--arcane);color:#160d2c}
.sigbtn:disabled{opacity:.4;cursor:default}
.sigtxt{font-size:.78rem;color:#e6cfff}
.kwref{color:#e2c6ff;border-bottom:1px dotted var(--arcane);cursor:help}
.hp .inc{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,107,91,.95) 0 4px,rgba(255,107,91,.45) 4px 8px)}
.hp .inc.psn{background:repeating-linear-gradient(135deg,rgba(155,227,123,.95) 0 4px,rgba(155,227,123,.4) 4px 8px)}
.hp .inc.prev{background:repeating-linear-gradient(135deg,rgba(255,209,102,.98) 0 4px,rgba(255,209,102,.5) 4px 8px)}
.hp .mark{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;opacity:.85}
.enrb{font:700 .68rem var(--mono);color:#ffb86b}
.die.boosted .pips{color:#ffd166}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--hud);pointer-events:none;z-index:60;animation:sparkup 1.6s ease-out forwards}
@keyframes sparkup{to{transform:translate(var(--x),var(--y));opacity:0}}
@media (prefers-reduced-motion:reduce){.spark{animation:none}}
.sigcell{display:inline-flex;flex-direction:column;gap:2px}
.sigwhy{font-size:.72rem;color:var(--muted)}
.center{margin:12px 0;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.phase{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.phase span{font:600 .74rem var(--mono);padding:3px 9px;border-radius:3px;background:var(--panel2);color:var(--muted)}
.phase span.on{background:var(--hud);color:#231702}
.hint{font-size:.9rem;color:var(--muted);max-width:46rem;min-height:1.3rem}
.log{max-width:820px;margin:12px auto 0}
.log table{width:100%;border-collapse:collapse;font-size:.82rem}
.log td,.log th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
.log th{font-family:var(--display);color:var(--muted)}
.float{position:fixed;pointer-events:none;font:800 1.35rem var(--mono);z-index:50;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 3px #000}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}
@keyframes an-hit{0%{transform:none;box-shadow:0 0 0 3px rgba(255,107,91,.9)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}100%{transform:none;box-shadow:0 0 0 0 rgba(255,107,91,0)}}
@keyframes an-heal{0%{box-shadow:0 0 0 0 rgba(123,227,154,.9)}50%{box-shadow:0 0 18px 4px rgba(123,227,154,.7)}100%{box-shadow:0 0 0 0 rgba(123,227,154,0)}}
@keyframes an-ward{0%{box-shadow:0 0 0 0 rgba(127,178,255,.9)}50%{box-shadow:0 0 18px 4px rgba(127,178,255,.75)}100%{box-shadow:0 0 0 0 rgba(127,178,255,0)}}
@keyframes an-stun{0%{transform:none;filter:brightness(2.2)}30%{transform:rotate(-3deg)}60%{transform:rotate(3deg)}100%{transform:none;filter:none}}
@keyframes an-kill{0%{transform:scale(1);opacity:1}20%{transform:scale(1.08) rotate(-2deg);filter:brightness(2.4)}50%{transform:scale(1.02) rotate(2deg);filter:brightness(1.4) saturate(0)}100%{transform:scale(.9) translateY(8px);opacity:.3;filter:grayscale(1)}}
@keyframes an-charge{0%{box-shadow:0 0 0 0 rgba(199,125,255,.9)}50%{box-shadow:0 0 16px 4px rgba(199,125,255,.7)}100%{box-shadow:0 0 0 0 rgba(199,125,255,0)}}
.an-hit{animation:an-hit .45s ease-out}.an-heal{animation:an-heal .7s ease-out}.an-ward{animation:an-ward .7s ease-out}.an-stun{animation:an-stun .5s ease-out}.an-kill{animation:an-kill .9s ease-out forwards}.an-lunge{animation:an-lunge .35s ease-out}.an-charge{animation:an-charge .6s ease-out}
.die.used{transition:opacity .25s,transform .25s}
#app.holding{pointer-events:none}
#app.holding .ctrlwrap,#app.holding .sigwhy{visibility:hidden}
.foe.atk-src{border-color:var(--foe);box-shadow:0 0 0 2px rgba(255,107,91,.55)}
.foe .die.atk-on{border-color:#ffd166;box-shadow:0 0 0 3px #ffd166,0 0 12px 2px rgba(255,209,102,.6);transform:scale(1.1)}
.op.atk-me{box-shadow:0 0 0 2px #ffd166}
.fxpop{position:fixed;pointer-events:none;z-index:52;transform:translate(-50%,-50%);line-height:1}
.fx-slash{width:90px;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff 40%,var(--dmg) 70%,transparent);animation:fxslash .35s ease-out forwards}
@keyframes fxslash{0%{opacity:0;transform:translate(-50%,-50%) rotate(-35deg) scaleX(.2)}40%{opacity:1;transform:translate(-50%,-50%) rotate(-35deg) scaleX(1.1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-35deg) scaleX(1.3)}}
.fx-shield{font-size:2.6rem;filter:drop-shadow(0 0 10px rgba(127,178,255,.9));animation:fxshield .7s ease-out forwards}
@keyframes fxshield{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fx-skull{font-size:2.8rem;animation:fxskull 1s ease-out forwards}
@keyframes fxskull{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
@keyframes an-atk{0%{transform:none}30%{transform:translateX(12px) scale(1.04)}100%{transform:none}}
@keyframes an-down{0%{transform:none;filter:none}25%{transform:translateY(-4px) rotate(-2deg);filter:brightness(1.8)}100%{transform:translateY(4px) rotate(1deg);filter:grayscale(1) brightness(.7)}}
.an-atk{animation:an-atk .3s ease-out}.an-down{animation:an-down .8s ease-out forwards}

  st.players.forEach((P, p) => { if (!P.gone && !P.down && P.poison) hurtPlayer(st, p, P.poison, 'Poison', false); });
  st.players.forEach(P => { P.ward = 0; P.cover = false; P.usedLast = P.roll.map(d => d.used && !d.winding); });
  st.resolveN++;
  if (!living(st).length) { st.phase = 'over'; st.result = 'lost'; return; }
  if (!foesAlive(st).length) { floorCleared(st); return; }
  startTurn(st);
}

// An item fits if it changes at least one of the operative's faces (abilities always fit).
function gearFits(P, g) {
  const G = ITEMS[g]; if (G.ability || !G.fx) return true;
  if (G.coil) return P.dice.some((d, di) => facesOf(P, di).some(c => parse(c).kw.includes('chain')));
  return P.dice.some((d, di) => { const base = facesOf(P, di); return base.some((c, fi) => { const f = parse(c), before = JSON.stringify(f); G.fx(f, fi, base); return JSON.stringify(f) !== before; }); });
}
const needsSigUp = (st, P) => (st.floor === RULES.abilityFloor && (P.sigUps || []).length < 1) || (st.floor === PROMO_FLOOR && (P.sigUps || []).length < 2);
function nextFloorIfReady(st) { if (st.players.every(x => x.gone || (x.picked && x.ready))) { st.floor++; startFloor(st); } }
function floorCleared(st) {
  st.resolveN++;
  if (st.floor >= RULES.floors) { st.phase = 'over'; st.result = 'won'; return; }
  st.phase = 'upgrade';
  st.players.forEach((P, p) => {
    if (P.gone) { P.picked = true; return; }
    P.vit = 0;
    const mx = maxHp(st, p);
    P.hp = Math.min(P.hp, mx);
    if (P.down) { P.down = false; P.hp = Math.ceil(mx / 2); }
    else P.hp = Math.min(mx, P.hp + Math.ceil((mx - P.hp) / 2));
    P.picked = false; P.ready = false; P.step = 'wait'; P.roll = []; P.ward = 0; P.cast = []; P.poison = 0; P.curse = false; P.regen = 0;
    const free = P.dice.map((d, i) => i).filter(i => P.dice[i].plus == null);
    if (st.floor === PROMO_FLOOR) P.offers = [{ k:'promo' }];
    else if (UPGRADE_FLOORS.includes(st.floor) && free.length) P.offers = [{ k:'plus', d: pick(st, free) }];   // the die is random; you pick which upgrade
    else {
      const pool = Object.keys(ITEMS).filter(id => ITEMS[id].floor === st.floor && (!ITEMS[id].cls || ITEMS[id].cls === P.cls));
      const fits = shuffle(st, pool.filter(id => gearFits(P, id))), rest = shuffle(st, pool.filter(id => !gearFits(P, id)));
      P.offers = [...fits, ...rest].slice(0, st.bounty ? 5 : 3).map(id => ({ k:'item', id }));
      P.gotBounty = !!st.bounty;
    }
    if (P.away) {   // an absent operative takes the first offer so the squad isn't held up
      const o = P.offers[0];
      if (o.k === 'plus') { P.dice[o.d].plus = 0; P.bonusHp = (P.bonusHp || 0) + RULES.hpPerUpgrade; P.hp += RULES.hpPerUpgrade; }
      else if (o.k === 'promo') { P.bonusHp = (P.bonusHp || 0) + RULES.hpPerUpgrade; P.hp += RULES.hpPerUpgrade; }
      else { const d = P.dice.reduce((b, x, i) => x.gear.length < P.dice[b].gear.length ? i : b, 0); if (P.dice[d].gear.length < RULES.gearPerDie) P.dice[d].gear.push(o.id); }
      if (needsSigUp(st, P)) P.sigUps = [...(P.sigUps || []), Object.keys(SIG_UPS[CLASSES[P.cls].sig]).find(id => !hasUp(P, id))];
      P.picked = true; P.ready = true;
    }
  });
  if (st.players.some(P => P.gotBounty)) { st.bounty = false; st.players.forEach(P => { P.gotBounty = false; }); }
  nextFloorIfReady(st);
}

// ================= TEST BOT (dev harness and auto-play) =================
function botNext(st, p) {
  const P = st.players[p]; if (!P) return null;
  if (st.phase === 'upgrade' && P.picked && !P.ready && !P.gone) return { t:'cont' };
  if (st.phase === 'upgrade' && !P.picked) {
    const o = P.offers[0];
    if (o.k === 'promo' || (o.k === 'plus' && P.dice[o.d].plus != null)) { const ids = Object.keys(SIG_UPS[CLASSES[P.cls].sig]).filter(id => !hasUp(P, id)); return { t:'sigup', id: ids[(p + st.rollN) % ids.length] }; }
    if (o.k === 'plus') return { t:'take', i: 0, v: (p + st.floor) % 2 };
    const d = P.dice.reduce((b, x, i) => x.gear.length < P.dice[b].gear.length ? i : b, 0);
    return { t:'take', i: 0, d, r: P.dice[d].gear.length >= RULES.gearPerDie ? 0 : undefined };
  }
  if (st.phase !== 'battle' || P.down || P.gone) return null;
  if (P.step === 'roll') {
    const want = P.roll.map((d, di) => { if (d.winding || d.released) return d.k; const f = effFace(st, p, di, d.fi); return f.t !== 'B' && f.n >= 2; });
    const tog = P.roll.findIndex((d, i) => d.k !== want[i] && !(d.k && effFace(st, p, i, d.fi).kw.includes('sticky')));
    if (tog >= 0) return { t:'keep', i: tog };
    if (P.rerolls > 0 && want.includes(false)) return { t:'reroll' };
    return { t:'done' };
  }
  if (P.step === 'use') {
    const al = foesAlive(st), lv = living(st);
    const order = ['W', 'D', 'H', 'C'];
    let best = null;
    P.roll.forEach((d, di) => { if (d.used) return; const f = effFace(st, p, di, d.fi); if (f.t === 'B' || (f.t === 'D' && !windsUp(P, di, f) && !al.some(i => faceCanHit(st, f, i)))) return; const r = order.indexOf(f.t) + (f.kw.includes('stun') ? -2 : 0); if (best == null || r < best.r) best = { di, f, r }; });
    if (best) {
      const t = best.f.t; let tg = null;
      const hitable = al.filter(i => faceCanHit(st, best.f, i));
      if (t === 'D') tg = { k:'e', i: best.f.kw.includes('stun') ? hitable.reduce((b, i) => intentSize(st, st.enemies[i]) > intentSize(st, st.enemies[b]) ? i : b, hitable[0]) : hitable.reduce((b, i) => st.enemies[i].hp < st.enemies[b].hp ? i : b, hitable[0]) };
      else if (t === 'W') tg = { k:'p', i: lv.reduce((b, i) => incomingTo(st, i) - st.players[i].ward > incomingTo(st, b) - st.players[b].ward ? i : b, p) };
      else if (t === 'H') tg = { k:'p', i: lv.reduce((b, i) => (maxHp(st, i) - st.players[i].hp) > (maxHp(st, b) - st.players[b].hp) ? i : b, p) };
      return { t:'use', i: best.di, tg };
    }
    for (const s of [CLASSES[P.cls].sig, ...abilitiesOf(P)]) if (!(P.cast || []).includes(s) && P.charge >= sigCost(st, p, s) && abilityUsable(st, p, s)) return { t:'cast', s };
    return { t:'ready' };
  }
  return null;
}

}

    s.style.setProperty('--x', (n - 4) * 7 + 'px'); s.style.setProperty('--y', -(16 + (n % 3) * 12) + 'px');

  fresh.forEach((l, k) => setTimeout(() => {
    if (!st) return;
    const s = l.src + ' ' + l.res, el = eventTarget(l.tgt);

      const atk = st.enemies.findIndex((x, i) => l.src.startsWith(en(st, i)));

      if (/Summoned/.test(l.res)) sfx.summon();

      else if (/✚/.test(l.src)) { sfx.heal(); animate(el, 'an-heal'); }
      else if (/\(down\)/.test(l.res)) { sfx.down(); animate(el, 'an-down'); fxPop(el, 'fx-skull', '💀'); }
      else if (/→/.test(l.res)) { sfx.enemyHit(); fxHit(el); }

    if (/^Saved/.test(l.res)) { sfx.save(); sparks(el); return; }
    const by = st.players.findIndex(P => l.src.startsWith(P.name));   // the operative acting lunges toward its target
    if (by >= 0 && /→/.test(l.res) && el && el.dataset.key && el.dataset.key[0] === 'e') animate(document.querySelector(`[data-key="p:${by}"]`), 'an-atk');
    if (/✖/.test(l.res)) { sfx.kill(); animate(el, 'an-kill'); fxPop(el, 'fx-skull', '💀'); }
    else if (/Stunned/.test(l.res)) { sfx.stun(); animate(el, 'an-stun'); }
    else if (/Intent rewritten/.test(l.res)) { sfx.sight(); animate(el, 'an-stun'); }
    else if (/ward/.test(l.res)) { sfx.ward(); fxWard(el); }
    else if (/✦$/.test(l.res)) { sfx.charge(); animate(el, 'an-charge'); }
    else if (/Poison/.test(l.src) || /Poisoned/.test(l.res)) { sfx.hit(); fxHit(el); }
    else if (/✚|self-heal/.test(s) || /Back up/.test(l.res)) { sfx.heal(); animate(el, 'an-heal'); }
    else if (/ ✦ /.test(l.src)) { sfx.cast(); fxHit(el); }
