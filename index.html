<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kevlar &amp; Cantrips</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e131d'/><path d='M16 4 L27 8 V16 C27 22 22 26.5 16 28.5 C10 26.5 5 22 5 16 V8 Z' fill='%23243049' stroke='%23f0b23c' stroke-width='2'/><rect x='10.5' y='10.5' width='11' height='11' rx='2.5' fill='%23e4e8f0'/><circle cx='13.5' cy='13.5' r='1.4' fill='%230e131d'/><circle cx='18.5' cy='18.5' r='1.4' fill='%230e131d'/><path d='M22 4 L19 10 H23 L20 16' stroke='%23c77dff' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0e131d; --panel:#161e2c; --panel2:#1f2a3d; --line:#2e3b54; --fg:#e4e8f0; --muted:#8e9ab3;
  --hud:#f0b23c; --hud-dim:#6e5420; --arcane:#c77dff; --arcane-dim:#4b2f6b;
  --ally:#5aa9ff; --foe:#ff6b5b; --ok:#5fd28a;
  --dmg:#ff8a73; --ward:#7fb2ff; --heal:#7be39a; --pierce:#ffd166; --arc:#9be7ff; --chg:#d4a8ff; --stun:#ffb3e6; --sight:#7fe0d0; --blk:#68748c;
  --display:"Chakra Petch","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.4;min-height:100vh}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:.02em}
h2{font-size:1.45rem;color:var(--hud)}
h3{font-size:1.1rem}
h4{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:10px 16px 40px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{font:700 .9rem var(--display);letter-spacing:.04em;background:var(--hud);color:#231702;border:0;border-radius:4px;padding:.45rem .95rem;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{font-size:.78rem;padding:.25rem .6rem}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:4px;width:2.1rem;height:2.1rem;font-size:1rem;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hud);outline-offset:2px}
input{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:.4rem .6rem}
.tag{display:inline-block;font:600 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--panel2);color:var(--muted)}
.chip{font:600 .78rem var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 9px;white-space:nowrap}
.chip.hud{color:var(--hud);border-color:var(--hud-dim)}
.chip.arc{color:var(--arcane);border-color:var(--arcane-dim);cursor:help}
.banner{background:#2a2412;border:1px solid var(--hud-dim);color:#ffe7b3;padding:.35rem .8rem;border-radius:4px;font-size:.9rem}
.err{color:var(--foe)}

/* faces + dice */
.f{display:inline-flex;align-items:center;justify-content:center;gap:1px;min-width:1.9rem;height:1.6rem;padding:0 4px;border-radius:4px;background:#0b1018;border:1px solid var(--line);font:700 .78rem var(--mono);cursor:help}
.f-D{color:var(--dmg)}.f-W{color:var(--ward)}.f-H{color:var(--heal)}.f-R{color:var(--pierce)}.f-A{color:var(--arc)}.f-C{color:var(--chg)}.f-S{color:var(--stun)}.f-E{color:var(--sight)}.f-B{color:var(--blk)}.f-U{color:var(--hud)}.f-X{color:var(--dmg)}
.faces{display:flex;gap:3px;flex-wrap:wrap}
.facepick .f{cursor:pointer}.facepick .f:hover{outline:2px solid var(--hud)}
.facepick .f.no{opacity:.35;cursor:not-allowed;outline:none}
.die{width:3.7rem;height:3.7rem;border-radius:9px;background:linear-gradient(160deg,#eef1f6,#c9d0dc);color:#1b2230;display:flex;align-items:center;justify-content:center;gap:2px;font:800 1.2rem var(--mono);border:2px solid #9aa5b8;box-shadow:0 3px 0 #5d6779;position:relative;user-select:none;flex:none;transition:transform .12s}
.die.f-D{color:#c4361f}.die.f-W{color:#2862c4}.die.f-H{color:#1f8f44}.die.f-R{color:#a86f00}.die.f-A{color:#0a7ea0}.die.f-C{color:#7440c9}.die.f-S{color:#b0287a}.die.f-E{color:#0f7c8c}.die.f-B{color:#8892a3;font-size:1.8rem}
.die.mine{cursor:pointer}
.die.kept{border-color:var(--hud);box-shadow:0 0 0 3px var(--hud),0 3px 0 #5d6779;transform:translateY(-2px)}
.die.sel{box-shadow:0 0 0 4px #fff,0 3px 0 #5d6779;transform:scale(1.06)}
.die.used{opacity:.55}
.die.empty{background:#1b2436;border-color:var(--line);box-shadow:none;color:var(--muted);font-size:.9rem}
.die.roll{animation:roll .42s ease-out}
@keyframes roll{0%{transform:rotate(-25deg) scale(.75)}60%{transform:rotate(10deg) scale(1.06)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
.die .gears{position:absolute;top:-8px;right:-8px;display:flex;gap:2px}
.die .gear{width:1.35rem;height:1.35rem;border-radius:50%;background:var(--panel2);border:1px solid #7fd3e6;display:flex;align-items:center;justify-content:center;font-size:.7rem}
.die em.kws{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:700 .72rem var(--mono);font-style:normal;color:#6a2ea3;letter-spacing:2px;line-height:1}
.foe .die em.kws{color:var(--arcane)}
.f{position:relative;height:2.3rem;min-width:2.5rem;align-items:flex-start;justify-content:flex-start;padding:3px 0 0 5px}
.f .ico{font-size:1rem;margin:0}
.f .kwg{position:absolute;bottom:1px;left:0;right:0;text-align:center;font:700 .7rem/1 var(--mono);font-style:normal;color:var(--arcane);letter-spacing:1px}
.psnb{font:700 .7rem var(--mono);color:#9be37b}
.log tr.sys td{color:var(--hud);font:600 .72rem var(--mono);letter-spacing:.08em;padding-top:8px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.topbar .title{font-family:var(--display);font-size:1.15rem;color:var(--hud);display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}

/* enemies */
.enemyrow{display:flex;gap:12px;flex-wrap:wrap}
.foe{background:var(--panel);border:1px solid #4a2b30;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:7px;align-items:center;width:10rem;position:relative}
.foe.boss{width:13rem;border-color:#7a2b2b;background:#1d1519}
.foe.dead{opacity:.3;filter:grayscale(1)}
.foe .nm{font:600 .9rem var(--display);text-align:center;line-height:1.1}
.foe .ic{font-size:1.3rem}
.foe .ints{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.foe .int{display:flex;flex-direction:column;align-items:center;gap:2px}
.foe .die{width:2.9rem;height:2.9rem;font-size:.95rem;background:linear-gradient(160deg,#3a2226,#2a181b);border-color:#6b3a3f;box-shadow:0 2px 0 #1b0f11;color:var(--dmg)}
.foe .die.f-W{color:var(--ward)}.foe .die.f-H{color:var(--heal)}.foe .die.f-U{color:var(--hud)}.foe .die.f-B{color:var(--blk);font-size:1.4rem}
.foe .die.stun{opacity:.35}
.foe .to{font:500 .7rem var(--mono);color:var(--muted)}
.foe .inc{font:600 .72rem var(--mono);color:var(--hud);min-height:1rem;text-align:center}
.hp{width:100%;height:.95rem;background:#0b1018;border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#b8432f,#ff6b5b);transition:width .3s}
.hp.ally i{background:linear-gradient(90deg,#2f7bb8,#5aa9ff)}
.hp span{position:relative;display:block;text-align:center;font:600 .66rem/.85rem var(--mono)}
.wardb{font:700 .7rem var(--mono);color:var(--ward)}
.stunb{font:700 .7rem var(--mono);color:var(--stun)}
.tg-ok{border-color:var(--hud)!important;box-shadow:0 0 0 2px var(--hud-dim);cursor:crosshair}
.tg-ok:hover{background:#221d10}

/* squad */
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.op{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.op.me{border-color:var(--arcane);box-shadow:0 0 0 1px var(--arcane-dim)}
.op.down{opacity:.55}
.op .ctrlwrap{display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px dashed var(--line)}
.op .ctrl{gap:8px;min-height:2.2rem}
.op .ctrlwrap .hint{font-size:.85rem;min-height:0}
.op .hh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.op .hh b{font-family:var(--display);font-size:1.05rem}
.op .sub{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.op .dice{display:flex;gap:12px;flex-wrap:nowrap;min-height:5.2rem}
.op .dcol{display:flex;flex-direction:column;align-items:center;gap:4px;width:5rem}
.op .tg{font:500 .68rem var(--mono);color:var(--muted);text-align:center;line-height:1.2;min-height:.85rem}
.dname{font:600 .7rem var(--mono);color:var(--muted);background:none;border:0;border-bottom:1px dashed var(--line);cursor:pointer;padding:0;text-align:center;line-height:1.2}
.dname:hover{color:var(--fg);border-color:var(--hud)}
/* unfolded die: top, a row of four, bottom */
.net{display:grid;grid-template-columns:repeat(4,var(--s,3rem));grid-auto-rows:var(--s,3rem);gap:5px}
.net .nf{border-radius:8px;background:linear-gradient(160deg,#eef1f6,#c9d0dc);border:2px solid var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 calc(var(--s,3rem) * .32) var(--mono);color:#1b2230;position:relative;cursor:help}
.die{--s:3.7rem}.foe .die{--s:2.9rem}.f{--s:2.1rem}
.ico{font-size:calc(var(--s,3rem) * .5);line-height:1;margin-right:calc(var(--s,3rem) * .14);font-style:normal}
.ico.combo{border-radius:50%;box-shadow:0 0 0 2px currentColor;padding:1px}   /* built-in pairing: ring in the face-type color */
.pips{position:absolute;right:calc(var(--s,3rem) * .08);bottom:calc(var(--s,3rem) * .14);display:flex;gap:calc(var(--s,3rem) * .05);align-items:flex-end;font-style:normal}
.pips .ticks{display:flex;flex-direction:column-reverse;gap:calc(var(--s,3rem) * .05)}
.pips b{display:block;width:calc(var(--s,3rem) * .13);height:calc(var(--s,3rem) * .08);background:currentColor;border-radius:1px}
.pips b.p5{height:calc(var(--s,3rem) * .52)}
.f .pips{bottom:auto;top:calc(var(--s) * .12)}
.f .pips b{min-width:2px;min-height:2px}
.net .nf.f-D{color:#c4361f}.net .nf.f-W{color:#2862c4}.net .nf.f-H{color:#1f8f44}.net .nf.f-R{color:#a86f00}.net .nf.f-A{color:#0a7ea0}.net .nf.f-C{color:#7440c9}.net .nf.f-S{color:#b0287a}.net .nf.f-E{color:#0f7c8c}.net .nf.f-B{color:#8892a3}
.net .nf .kwg{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:700 calc(var(--s,3rem) * .25) var(--mono);font-style:normal;color:#6a2ea3;letter-spacing:1px;line-height:1}
.net .p0{grid-area:1/2}.net .p1{grid-area:2/1}.net .p2{grid-area:2/2}.net .p3{grid-area:2/3}.net .p4{grid-area:2/4}.net .p5{grid-area:3/2}
.netwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.op .badges{display:flex;gap:4px;flex-wrap:wrap;min-height:1.2rem}
.bdg{font:700 .7rem var(--mono);padding:1px 6px;border-radius:3px;background:#0b1018;border:1px solid var(--line)}
.bdg.D{color:var(--dmg);border-color:#6b3329}.bdg.W{color:var(--ward)}.bdg.H{color:var(--heal)}
.status{font:700 .7rem var(--mono);letter-spacing:.08em}
.status.ready{color:var(--ok)}.status.roll,.status.aim{color:var(--hud)}.status.down,.status.gone{color:var(--foe)}
.sigbtn{font:700 .78rem var(--display);background:#2d2350;color:#e2d4ff;border:1px solid #5a4796;border-radius:4px;padding:.3rem .6rem;cursor:pointer;align-self:flex-start}
.sigbtn.on{background:var(--arcane);color:#160d2c}
.sigbtn:disabled{opacity:.4;cursor:default}
.sigtxt{font-size:.78rem;color:#e6cfff}
.sigcell{display:inline-flex;flex-direction:column;gap:2px}
.sigwhy{font-size:.72rem;color:var(--muted)}
.center{margin:12px 0;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.phase{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.phase span{font:600 .74rem var(--mono);padding:3px 9px;border-radius:3px;background:var(--panel2);color:var(--muted)}
.phase span.on{background:var(--hud);color:#231702}
.hint{font-size:.9rem;color:var(--muted);max-width:46rem;min-height:1.3rem}
.log{max-width:820px;margin:12px auto 0}
.log table{width:100%;border-collapse:collapse;font-size:.82rem}
.log td,.log th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
.log th{font-family:var(--display);color:var(--muted)}
.float{position:fixed;pointer-events:none;font:800 1.35rem var(--mono);z-index:50;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 3px #000}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}

/* tiles (lobby, upgrades) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:7px}
.tile.taken{opacity:.45}
.tile.picked{border-color:var(--arcane);box-shadow:0 0 0 1px var(--arcane-dim)}
.tile .hh{display:flex;gap:8px;align-items:center}
.tile .hh .ic{font-size:1.4rem}
.tile .hh b{font-family:var(--display);font-size:1.08rem;flex:1}
.tile .desc{font-size:.85rem;color:var(--muted);flex:1}
.tile .btn{align-self:flex-start}
.dl{display:flex;flex-direction:column;gap:3px}
.dl .dn{color:var(--muted);font:600 .7rem var(--mono)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{background:var(--panel);border:1px dashed var(--line);border-radius:5px;padding:7px 10px;font-size:.85rem;min-width:11rem}
.slot.full{border-style:solid}
.mydie{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}

/* menu */
.menu{max-width:660px;margin:26px auto;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;justify-content:center}
.menu .box{display:flex;flex-direction:column;gap:10px}
.code{font:700 2.6rem var(--mono);letter-spacing:.3em;color:var(--hud);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(4,6,10,.78);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px}
.overlay .box{max-width:780px;width:100%;display:flex;flex-direction:column;gap:10px}
.overlay table{border-collapse:collapse;font-size:.86rem}
.overlay td,.overlay th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
textarea{width:100%;min-height:6rem;font:.8rem var(--mono);background:#0b1018;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px}
#tip .net{margin:6px 0;white-space:normal}
#tip:has(.net){max-width:none}
#tip{white-space:pre-line;position:fixed;z-index:60;background:#070b11;border:1px solid var(--hud-dim);color:var(--fg);font-size:.82rem;padding:6px 9px;border-radius:4px;max-width:18rem;pointer-events:none;display:none}
.dev{border:1px dashed #7a5;border-radius:4px;padding:3px 7px;font-size:.78rem}
@media (max-width:640px){.foe{width:calc(50% - 6px)}.foe.boss{width:100%}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="tip"></div>
<div id="overlay" class="overlay hidden"></div>

<script>
'use strict';
// ================= DATA =================
// Faces are codes: type letter, number, then optional keywords, e.g. 'D2:cleave,engage'.
// Each die has a base set and a "+" set (from the die upgrade after floors 2, 5 and 8).
const CLASSES = {
  breach:{ name:'Breach Mage', icon:'💥', hp:14, role:'Piercing burst', sig:'doorkick', dice:[
    { name:'Scattershot', faces:['D2:cleave','D2','D3','R1','R2:engage','B'], plus:[
      { label:'Heavy Load',    faces:['D3:cleave','D3','D3:cleave','R2','R2:engage','R1'] },
      { label:'Wide Spread',   faces:['D2:cleave','D2:cleave','D3:cleave','R1:cleave','R2:engage','D1:cleave'] } ] },
    { name:'Breaching Charge', faces:['D4:engage','R3','R2','D1','B','B'], plus:[
      { label:'Bigger Charge', faces:['D5:engage','R4','R3','D2','R1:engage','B'] },
      { label:'Shaped Charge', faces:['R4:engage','R3:engage','R3','R2','D2','B'] } ] },
    { name:'Kevlar Ward', faces:['W2','W2','W3','W1','C1','B'], plus:[
      { label:'Thicker Plates', faces:['W3','W3','W4','W2:selfshield','C2','C1'] },
      { label:'Reactive Armor', faces:['W2:steel','W2:selfshield','W3','W2','C2','D2:steel'] } ] } ] },
  storm:{ name:'Storm Witch', icon:'⚡', hp:11, role:'Chain damage', sig:'thunder', dice:[
    { name:'Arc Lash', faces:['A2','A2','A3:charged','A1:cantrip','C1','B'], plus:[
      { label:'Overload',        faces:['A3','A3','A4:charged','A2:cantrip','C2','A1'] },
      { label:'Chain Lightning', faces:['A2:cleave','A2','A3:charged','A2:cantrip','C2','A1:cantrip'] } ] },
    { name:'Downdraft', faces:['W2','W1','A1','S','B','B'], plus:[
      { label:'Gale Force',      faces:['W3','W2','A2','S','S:cantrip','W1'] },
      { label:'Eye of the Storm',faces:['W2:selfshield','W2','A2:cantrip','S','S','C1'] } ] },
    { name:'Squall', faces:['C2','C1:cantrip','A2','D2:cruel','W1','B'], plus:[
      { label:'Downpour',        faces:['C3','C2:cantrip','A3','D3:cruel','W2','C1'] },
      { label:'Static Build-up', faces:['C2:cantrip','C2:cantrip','A2:charged','D2:cruel','W1','C1'] } ] } ] },
  precog:{ name:'Precog', icon:'👁', hp:10, role:'Control: stuns, rewrites intents', sig:'toldyou', dice:[
    { name:'Foresight', faces:['S','S','E','E:cantrip','C1','B'], plus:[
      { label:'Deep Trance',  faces:['S','S:cantrip','E','E:cantrip','C2','C1'] },
      { label:'Clear Vision', faces:['S','S','E:cantrip','E:cantrip','C2:cantrip','W1'] } ] },
    { name:'Second Guess', faces:['E','W2','W1','C2','C1','B'], plus:[
      { label:'Overthink',   faces:['E','W3','W2','C3','C2','E'] },
      { label:'Hedge Bets',  faces:['E','W2:pristine','W2','C2','C2','H2'] } ] },

function startTurn(st) {

function randCode() { let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
function publicState() { const { seed, ...rest } = st; return rest; }
function broadcastState() { const s = publicState(); for (const c of net.conns.values()) if (c.conn.open) c.conn.send({ t:'state', s }); }
function startHost(tries = 0) {
  if (!window.Peer) { ui.err = 'Could not load the PeerJS library. Check your internet connection.'; render(); return; }
  const code = randCode();
  net.myName = myName(); screen = 'lobby'; ui.err = ''; ui.lobbyMsg = 'Contacting the PeerJS broker…'; render();
  const peer = new Peer(PREFIX + code, { debug: 1 });
  net.peer = peer;
  peer.on('open', () => {
    net.role = 'host'; net.code = code; ui.lobbyMsg = '';
    st = newRun('mp', (Math.random() * 2 ** 31) | 0); addPlayer(st, net.myName); me = 0; screen = 'game'; afterChange();
  });
  peer.on('connection', conn => {
    conn.on('open', () => {
      if (!st || st.phase !== 'lobby') { conn.send({ t:'full', msg:'That squad already started its run.' }); setTimeout(() => conn.close(), 300); return; }
      if (st.players.length >= RULES.maxPlayers) { conn.send({ t:'full', msg:'That squad is full (4 operatives).' }); setTimeout(() => conn.close(), 300); return; }
      net.conns.set(conn.peer, { conn, pi: null });
    });
    conn.on('data', d => hostOnData(conn, d));
    conn.on('close', () => dropGuest(conn.peer));
  });

    if (net.peer !== peer) return;
    if (e.type === 'unavailable-id' && tries < 5) { peer.destroy(); startHost(tries + 1); return; }
    netError(e);

}

  const g = net.conns.get(conn.peer); if (!g || !st) return;
  if (d.t === 'hello' && g.pi == null) {
    if (st.phase !== 'lobby' || st.players.length >= RULES.maxPlayers) { conn.send({ t:'full', msg:'Could not join.' }); return; }
    g.pi = addPlayer(st, String(d.name || 'Operative').slice(0, 14));
    conn.send({ t:'you', pi: g.pi }); sfx.join(); afterChange();
  } else if (d.t === 'act' && g.pi != null) {
    const err = act(st, g.pi, d.a);
    if (err) { conn.send({ t:'err', msg: err }); return; }
    afterChange();
  }
}
function dropGuest(id) {
  const g = net.conns.get(id); net.conns.delete(id);
  if (!g || g.pi == null || !st) return;
  if (st.phase === 'lobby') {
    removePlayer(st, g.pi);
    for (const o of net.conns.values()) if (o.pi != null && o.pi > g.pi) { o.pi--; if (o.conn.open) o.conn.send({ t:'you', pi: o.pi }); }
  } else {

function startJoin(code) {

  if (!/^[A-Z]{4}$/.test(code)) { ui.err = 'Enter the 4-letter room code.'; render(); return; }
  if (!window.Peer) { ui.err = 'Could not load the PeerJS library. Check your internet connection.'; render(); return; }
  screen = 'lobby'; ui.err = ''; ui.lobbyMsg = 'Contacting the PeerJS broker…'; render();
  const peer = new Peer({ debug: 1 });
  net.peer = peer;
  peer.on('open', () => {

    net.host = conn; net.code = code;
    net.joinTimer = setTimeout(() => { if (net.peer === peer && !conn.open) netError({ type:'timeout', message:'Could not reach the host. Their network (or yours) may block direct connections.' }); }, 15000);
    conn.on('open', () => { clearTimeout(net.joinTimer); net.role = 'client'; conn.send({ t:'hello', name: myName() }); ui.lobbyMsg = 'Connected. Joining the squad…'; render(); });

      const why = used ? 'Used this turn' : P.step === 'roll' ? 'Finish rolling first' : P.step !== 'use' ? 'Your turn is over' : P.charge < cost ? `Needs ${cost} ✦ (you have ${P.charge})` : !abilityUsable(st, p, s) ? 'Nothing to use it on' : '';
      return `<span class="sigcell"><button class="sigbtn" data-cast="${s}" ${why ? 'disabled' : ''} data-tip="${esc(SIGS[s].name + ' (' + cost + '✦): ' + SIGS[s].text + (why ? '\n' + why : ''))}">✦ ${SIGS[s].name} ${cost}</button>${why ? `<span class="sigwhy">${why}</span>` : ''}</span>`;
    }).join('')}</div>`;
  } else sig = `<span class="sigtxt">${abil.map(s => `<span data-tip="${esc(SIGS[s].text)}">✦ ${SIGS[s].name} ${sigCost(st, p, s)}</span>`).join(' · ')}</span>`;
  const equip = P.equip.map(r => `<span data-tip="${esc(EQUIP[r].name + ': ' + EQUIP[r].text)}">${EQUIP[r].icon}</span>`).join(' ');
  const ok = canTarget('p', p) ? 'tg-ok' : '';
  return `<div class="op ${mine ? 'me' : ''} ${P.down || P.gone ? 'down' : ''} ${ok}" data-tk="p" data-ti="${p}" data-key="p:${p}">
    <div class="hh"><b>${pname(p)}</b><span class="status ${status}">${statusTxt}</span></div>
    <div class="sub"><span>${C.icon} ${C.name}</span><span style="color:var(--chg)" data-tip="Charge: spend it on your abilities. Resets each floor.">✦${P.charge}</span>${P.ward ? `<span class="wardb" data-tip="Ward: blocks enemy damage this turn.">🛡${P.ward}</span>` : ''}${equip}</div>
    <div class="hp ally"><i style="width:${P.hp / mx * 100}%"></i><span>${P.down ? 'Down' : `${P.hp}/${mx}`}</span></div>
    <div class="dice">${dice}</div>

    ${mine && st.phase === 'battle' ? `<div class="ctrlwrap">${ui.hint ? `<div class="hint" style="text-align:left">${ui.hint}</div>` : ''}<div class="row ctrl">${ui.controls || ''}</div></div>` : ''}
  </div>`;
}
function logTable(lines, title) {
  const rows = lines.map(l => l.side === 'sys' ? `<tr class="sys"><td colspan="3">${esc(l.src)}</td></tr>` : `<tr><td style="color:${l.side === 'ally' ? 'var(--ally)' : 'var(--foe)'}">${esc(l.src)}</td><td>${esc(l.tgt)}</td><td>${esc(l.res)}</td></tr>`).join('');
  return rows ? `<h3 style="font-size:1rem;margin-bottom:4px">${title}</h3><table>${rows}</table>` : '';
}
function battleHtml() {
  const P = st.players[me];
  let hint = '', buttons = '';
  const waiting = living(st).filter(i => st.players[i].step !== 'ready' && i !== me).map(i => esc(st.players[i].name));
  if (!P || P.gone) hint = 'You left this run.';
  else if (P.down) hint = 'You\'re down. Your squad fights on, and you\'re back next floor at 50% HP.';
  else if (P.step === 'roll') {
    hint = 'Click dice to keep them, then reroll the rest. Cantrip faces fire as soon as they land.';
    buttons = `<button class="btn" data-ui="reroll" ${P.rerolls > 0 ? '' : 'disabled'}>Reroll (${P.rerolls} left)</button><button class="btn ghost" data-ui="done">Done rolling</button>`;
    if (P.roll.some(d => d.k)) hint = 'Kept dice stay; Reroll rolls the rest. Keep all three to move on.';
  } else if (P.step === 'use') {
    const f = selFace();
    hint = f ? (needsTarget(f.t) ? 'Click a highlighted enemy or operative. It happens right away.' : '') : 'Click a die to use it: it hits right away. ✦ dice charge on click. Click a die\'s name to see all its sides.';
    const left = P.roll.filter((d, di) => !d.used && effFace(st, me, di, d.fi).t !== 'B').length;
    const abil = [CLASSES[P.cls].sig, ...abilitiesOf(P)].filter(s => !(P.cast || []).includes(s) && P.charge >= sigCost(st, me, s) && abilityUsable(st, me, s)).length;
    if (ui.confirmEnd && (left || abil)) {
      hint = `You still have ${left ? `${left} unused ${left > 1 ? 'dice' : 'die'}` : ''}${left && abil ? ' and ' : ''}${abil ? `${abil} ability ready` : ''}. End your turn anyway?`;
      buttons = '<button class="btn ghost" data-ui="keepgoing">Keep playing</button><button class="btn" data-ui="endnow">End turn anyway</button>';
    } else buttons = `${canUndo(P) ? `<button class="btn ghost" data-ui="undo" data-tip="Back to rolling (${P.rerolls} reroll${P.rerolls > 1 ? 's' : ''} left)">↶ Undo</button>` : ''}<button class="btn ${left ? 'ghost' : ''}" data-ui="ready">End turn</button>`;
  } else {
    hint = waiting.length ? `Waiting for ${waiting.join(', ')}…` : 'Enemies are acting…';
    buttons = '<button class="btn ghost" data-ui="unready">Not ready yet</button>';
  }
  ui.controls = buttons; ui.hint = hint;
  return `
    <h4>Enemies · intent and target</h4>
    <div class="enemyrow" style="margin-top:6px">${st.enemies.map((_, i) => foeCard(i)).join('')}</div>
    <h4 style="margin-top:14px">Squad</h4>
    <div class="ops" style="margin-top:6px">${st.players.map((_, p) => opCard(p)).join('')}</div>
    <div class="center">
      <div class="phase"><span>Turn ${st.turn}</span><span class="on">Squad rolls &amp; acts</span><span>Enemies act when all are ready</span></div>
      ${st.msg ? `<div class="banner">${esc(st.msg)}</div>` : ''}
      ${waiting.length && P && P.step === 'ready' ? `<div class="hint">Waiting for ${waiting.join(', ')}…</div>` : ''}
    </div>
    <div class="log box">${logTable(st.log.slice(-16), 'Combat log') || '<span class="muted">Dice you use show up here as they land.</span>'}</div>`;
}

function offerDesc(o) {
  if (o.k === 'plus') return { icon:'⬆', name:'Die upgrade', tag:'A random die becomes +', text:'Pick one of two + versions.' };
  if (o.k === 'gear') return { icon: GEAR[o.id].icon, name: GEAR[o.id].name, tag:'Die equipment · 2 per die', text: GEAR[o.id].text };
  return { icon: EQUIP[o.id].icon, name: EQUIP[o.id].name, tag:'Player equipment · 2 max', text: EQUIP[o.id].text };
}
// Pips like Slice & Dice: a short tick is 1, a full-height bar is 5.
function pipBars(n) {
  if (!n) return '';
  return `<i class="pips">${'<b class="p5"></b>'.repeat(Math.floor(n / 5))}${n % 5 ? `<span class="ticks">${'<b></b>'.repeat(n % 5)}</span>` : ''}</i>`;
}
function netHtml(faces, size) {   // faces: effective face objects, laid out like an unfolded die
  return `<div class="net" style="--s:${size || '3rem'}">${faces.map((f, i) => `<div class="nf p${i} f-${f.t}" tabindex="0" data-tip="${esc(faceTip(f))}">${iconHtml(f)}${FACE[f.t].num ? pipBars(f.n) : ''}${kwGlyphs(shownKw(f))}</div>`).join('')}</div>`;
}
const effFaces = (p, di) => [0, 1, 2, 3, 4, 5].map(fi => effFace(st, p, di, fi));
const gearLine = d => d.gear.length ? `<div class="muted" style="font-size:.8rem">${d.gear.map(g => `<div data-tip="${esc(GEAR[g].text)}">${GEAR[g].icon} <b style="color:var(--fg)">${GEAR[g].name}</b>: ${GEAR[g].text}</div>`).join('')}</div>` : '';
function dieBlock(p, di, extra) {
  const P = st.players[p], d = P.dice[di];
  return `<div class="mydie"><button class="dname" style="font-size:.9rem;align-self:flex-start" data-inspect="${p}:${di}">${esc(dieName(P, di))}</button>
    ${netHtml(effFaces(p, di), '2.9rem')}${gearLine(d)}${extra || ''}</div>`;
}
function abilitiesHtml(p) {
  const P = st.players[p], own = CLASSES[P.cls].sig;
  const rows = [own, ...abilitiesOf(P)].map(s => `<div>✦ <b style="color:#e6cfff">${SIGS[s].name}</b> (${sigCost(st, p, s)}✦): ${SIGS[s].text}${s === own ? ' <span class="tag">signature</span>' : ' <span class="tag">from gear</span>'}</div>`).join('');
  return `<div style="font-size:.85rem" class="stack"><b>Charge abilities</b>${rows}<span class="muted">✦ comes from ✦ faces and resets each floor${hasEq(st, p, 'flask') ? ' (you start each floor with 2)' : ''}.</span></div>`;
}
function showDie(p, di) {
  const P = st.players[p], d = P.dice[di], o = $('overlay');
  const plus = d.plus != null ? `<span class="tag">+ ${esc(dieDef(P, di).plus[d.plus].label)}</span>` : '';
  const abil = d.gear.filter(g => GEAR[g].ability).map(g => `<div>✦ <b>${SIGS[GEAR[g].ability].name}</b> (${SIGS[GEAR[g].ability].cost}✦): ${SIGS[GEAR[g].ability].text}</div>`).join('');
  o.innerHTML = `<div class="box">
    <div class="row" style="justify-content:space-between"><h3>${esc(dieName(P, di))} ${plus}</h3><button class="btn ghost" data-ui="closehelp">Close</button></div>
    <p class="muted" style="margin:0">${p === me ? 'Your' : esc(P.name) + "'s"} ${CLASSES[P.cls].name} die. Hover a side to see exactly what it does.</p>
    <div class="netwrap">${netHtml(effFaces(p, di), '4.6rem')}
      <div class="stack" style="min-width:14rem;flex:1">${d.gear.length ? `<b>Equipped gear</b>${gearLine(d)}` : ''}${abil}</div></div>
  </div>`;
  o.classList.remove('hidden');
}
function upgradeHtml() {
  const P = st.players[me];
  const status = st.players.map((x, i) => `<span class="chip ${x.picked ? '' : 'hud'}">${pname(i)} ${x.gone ? '· left' : x.picked ? '✓' : '· choosing'}</span>`).join(' ');
  const next = FLOORS[st.floor];
  let body = '';
  if (P && !P.picked && !P.gone) {
    if (P.offers[0].k === 'plus') {
      const di = P.offers[0].d, D = dieDef(P, di);
      body = `<p class="muted" style="margin:0">Upgrade floor. The tower picked your <b style="color:var(--fg)">${esc(D.name)}</b> die. Choose how it upgrades (gear on it stays).</p>
      <div class="netwrap"><div class="mydie"><b>Now</b>${netHtml(effFaces(me, di), '2.9rem')}</div>
      ${D.plus.map((v, k) => `<div class="mydie"><b>${esc(D.name)}+ · ${esc(v.label)}</b>${netHtml(v.faces.map(parse), '2.9rem')}<button class="btn sm" data-plusv="${k}">Choose ${esc(v.label)}</button></div>`).join('')}</div>`;
    } else {
      const tiles = P.offers.map((o, i) => { const d = offerDesc(o); return `<div class="tile ${ui.pend === i ? 'picked' : ''}"><div class="hh"><span class="ic">${d.icon}</span><b>${d.name}</b></div><span class="tag" style="align-self:flex-start">${d.tag}</span><div class="desc">${d.text}</div><button class="btn sm" data-offer="${i}">Choose</button></div>`; }).join('');
      let chooser = '';
      if (ui.pend != null) {
        const o = P.offers[ui.pend];
        if (o.k === 'gear') chooser = `<div class="box stack"><h3>Which die gets the ${GEAR[o.id].icon} ${GEAR[o.id].name}?</h3><div class="tiles">${P.dice.map((d, di) => dieBlock(me, di, d.gear.length < RULES.gearPerDie ? `<button class="btn sm" data-gear="${di}">Install here</button>` : `<div class="row" style="gap:6px">${d.gear.map((g, r) => `<button class="btn sm ghost" data-gear="${di}" data-r="${r}">Replace ${GEAR[g].icon} ${GEAR[g].name}</button>`).join('')}</div>`)).join('')}</div><div><button class="btn ghost sm" data-ui="unpend">Cancel</button></div></div>`;
        else chooser = `<div class="box stack"><h3>You already carry 2 pieces of player equipment. Replace one?</h3><div class="row">${P.equip.map((e, r) => `<button class="btn ghost" data-equip="${r}">Replace ${EQUIP[e].icon} ${EQUIP[e].name}</button>`).join('')}<button class="btn ghost sm" data-ui="unpend">Cancel</button></div></div>`;
      }

  } else body = `<p class="muted">${P && P.gone ? 'You left this run.' : 'Picked. Waiting for your squad…'}</p>`;
  const mine = P && !P.gone && ui.pend == null ? `<div class="box stack"><h3>Your loadout · ${CLASSES[P.cls].icon} ${CLASSES[P.cls].name}</h3><div class="tiles">${P.dice.map((d, di) => dieBlock(me, di)).join('')}</div>
    <div class="muted" style="font-size:.85rem">HP ${P.hp}/${maxHp(st, me)} · Player equipment (${P.equip.length}/${RULES.equipPerPlayer}): ${P.equip.map(r => `<span data-tip="${esc(EQUIP[r].text)}">${EQUIP[r].icon} ${EQUIP[r].name}</span>`).join(', ') || 'none'}</div>${abilitiesHtml(me)}</div>` : '';
  const nextUp = UPGRADE_FLOORS.includes(st.floor + 1) ? ' After it: a die upgrade.' : '';
  return `<div class="stack">
    <div class="row" style="justify-content:space-between"><div><h2>Floor ${st.floor} cleared</h2><p class="muted" style="margin:4px 0 0">Everyone healed half their missing HP; downed operatives are back at 50%. Next: floor ${st.floor + 1}, ${esc(next.name)}.${nextUp}</p></div><div class="row">${status}</div></div>
    ${body}
    ${mine}
  </div>`;
}
function overHtml() {
  const won = st.result === 'won';
  const btn = me === 0 ? '<button class="btn" data-ui="restart">New run with this squad</button>' : '<span class="muted">The host can start a new run.</span>';
  return `<div class="stack" style="align-items:center;text-align:center;margin-top:16px">
    ${logoBig()}
    <h2>${won ? 'Tower cleared. Halcyon Grieve is out of office, permanently.' : `Squad down on floor ${st.floor}`}</h2>
    <p class="muted" style="margin:0">${won ? 'All 10 floors breached.' : esc(floorDef(st).name) + ' held. Regroup and breach again.'}</p>
    <div class="row" style="justify-content:center">${btn}<button class="btn ghost" data-ui="leave">Menu</button></div>
    <div class="log box" style="width:100%">${logTable(st.log.slice(-12), 'Last moments')}</div>
  </div>`;
}

function postRender() {
  if (!st || screen !== 'game') { renderCache.vals = {}; renderCache.sig = null; return; }
  const sig = { rollN: st.rollN, resolveN: st.resolveN, phase: st.phase, floor: st.floor, log: st.log.length ? st.log[st.log.length - 1] : null };
  const prev = renderCache.sig;
  if (prev) {
    if (sig.rollN !== prev.rollN) sfx.roll();
    if (sig.log && sig.log !== prev.log && prev.log && JSON.stringify(sig.log) !== JSON.stringify(prev.log)) {
      const s = sig.log.src + ' ' + sig.log.res;
      if (/ward/.test(s)) sfx.ward(); else if (/✦/.test(s)) sfx.charge(); else if (/⚡|➹/.test(s)) sfx.zap(); else if (/✚|heal/.test(s)) sfx.heal(); else if (/→/.test(s)) sfx.hit();
    }
    if (sig.phase !== prev.phase) { if (sig.phase === 'upgrade') sfx.clear(); if (sig.phase === 'over') st.result === 'won' ? sfx.win() : sfx.lose(); }
  }
  renderCache.sig = sig;
  Object.assign(renderCache.roll, renderCache.rollNext);
  const vals = {};
  st.players.forEach((P, p) => vals['p:' + p] = P.hp);
  st.enemies.forEach((e, i) => vals['e:' + i] = e.hp);
  if (prev && prev.floor === sig.floor && st.phase !== 'lobby') {
    for (const k in vals) {
      const old = renderCache.vals[k]; if (old == null || old === vals[k]) continue;
      const el = document.querySelector(`[data-key="${k}"]`); if (!el) continue;
      const r = el.getBoundingClientRect(), f = document.createElement('div'), dv = vals[k] - old;
      f.className = 'float'; f.textContent = (dv > 0 ? '+' : '') + dv; f.style.color = dv > 0 ? 'var(--heal)' : 'var(--dmg)';
      f.style.left = (r.left + r.width / 2 - 14) + 'px'; f.style.top = (r.top + 24) + 'px';
      document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
    }
  }
  renderCache.vals = vals;
}

// ================= INPUT =================
let autoTimer = null;
document.addEventListener('click', e => {
  if (e.target.id === 'overlay') { $('overlay').classList.add('hidden'); return; }   // click outside the box closes it
  const el = e.target.closest('[data-ui],[data-cls],[data-die],[data-cast],[data-offer],[data-plusv],[data-gear],[data-equip],[data-dev],[data-inspect]');
  ac();
  if (el) {
    const d = el.dataset;
    if (d.ui) return uiAction(d.ui);
    if (d.dev) return devAction(d.dev);
    if (d.cls) { sfx.click(); return dispatch({ t:'class', cls: d.cls }); }
    if (d.cast) { ui.sel = null; return dispatch({ t:'cast', s: d.cast }); }
    if (d.die != null && +d.p === me && st && st.phase === 'battle') {
      const P = st.players[me], di = +d.die;
      if (P.step === 'roll') { sfx.click(); return dispatch({ t:'keep', i: di }); }
      if (P.step === 'use') {
        const dd = P.roll[di]; if (dd.used) return;
        const f = effFace(st, me, di, dd.fi);
        if (f.t === 'B') return;
        if (!needsTarget(f.t)) { ui.sel = null; return dispatch({ t:'use', i: di }); }
        ui.sel = ui.sel === di ? null : di; return render();
      }
    }
    if (d.offer != null) {
      const P = st.players[me], o = P.offers[+d.offer];
      if (o.k === 'equip' && P.equip.length < RULES.equipPerPlayer) return dispatch({ t:'take', i: +d.offer });
      ui.pend = +d.offer; return render();
    }
    if (d.plusv != null) return dispatch({ t:'take', i: 0, v: +d.plusv });
    if (d.inspect) { const [ip, idi] = d.inspect.split(':').map(Number); return showDie(ip, idi); }
    if (d.gear != null) { const i = ui.pend; ui.pend = null; return dispatch({ t:'take', i, d: +d.gear, r: d.r != null ? +d.r : undefined }); }
    if (d.equip != null) { const i = ui.pend; ui.pend = null; return dispatch({ t:'take', i, r: +d.equip }); }
  }
  const card = e.target.closest('[data-tk]');
  if (card && ui.sel != null && canTarget(card.dataset.tk, +card.dataset.ti)) {
    const i = ui.sel; ui.sel = null;
    return dispatch({ t:'use', i, tg: { k: card.dataset.tk, i: +card.dataset.ti } });
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameIn') store.set('kc-name', e.target.value.trim().slice(0, 14));
  if (e.target.id === 'codeIn') ui.joinCode = e.target.value.toUpperCase();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('overlay').classList.add('hidden'); if (ui.sel != null) { ui.sel = null; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.die.mine')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'codeIn') uiAction('join');
});
function devAction(k) {
  if (!st || st.phase !== 'battle') return;
  if (k === 'win') { st.enemies.forEach(x => x.hp = 0); floorCleared(st); }
  if (k === 'charge') st.players[me].charge += 5;
  if (k === 'heal') st.players.forEach((P, p) => { if (!P.gone) { P.hp = maxHp(st, p); } });
  if (k === 'auto') { clearInterval(autoTimer); autoTimer = setInterval(() => { if (!st || net.role === 'client') return clearInterval(autoTimer); const a = botNext(st, me); if (a) dispatch(a); else if (st.phase === 'over') clearInterval(autoTimer); }, 250); return; }
  afterChange();
}
function uiAction(k) {
  switch (k) {
    case 'solo':
      teardown(); st = newRun('solo', (Math.random() * 2 ** 31) | 0); addPlayer(st, myName());
      me = 0; screen = 'game'; ui.err = ''; renderCache.sig = null; afterChange(); break;
    case 'continue': try { const s = JSON.parse(store.get(SAVE_KEY)); if (s.v !== 2) throw 0; st = s; me = 0; screen = 'game'; renderCache.sig = null; afterChange(); } catch { ui.err = 'That save is from an older version and can\'t be loaded.'; render(); } break;
    case 'export': showText('Export save', exportSave()); break;
    case 'import': showText('Paste a save', '', true); break;
    case 'importok': try { importSave($('saveTxt').value); $('overlay').classList.add('hidden'); render(); } catch (err) { $('saveErr').textContent = err.message; } break;
    case 'host': ui.joinCode = ''; startHost(); break;
    case 'join': startJoin(ui.joinCode || ($('codeIn') && $('codeIn').value)); break;
    case 'leave':
      clearInterval(autoTimer);
      if (st && st.mode === 'solo') saveSolo();
      if (net.peer) endSession('');
      else { st = null; screen = 'menu'; ui.err = ''; render(); }
      break;
    case 'help': showHelp(); break;
    case 'closehelp': $('overlay').classList.add('hidden'); break;
    case 'mute': muted = !muted; store.set('kc-mute', muted ? '1' : '0'); applyVol(); render(); break;
    case 'music': musicOn = !musicOn; store.set('kc-music', musicOn ? '1' : '0'); applyVol(); render(); break;
    case 'start': dispatch({ t:'start' }); break;
    case 'reroll': dispatch({ t:'reroll' }); break;
    case 'done': dispatch({ t:'done' }); break;
    case 'ready': {   // ask first if dice or abilities are left, so a stray click doesn't waste a turn
      ui.sel = null;
      const P = st.players[me], left = P.roll.filter((d, di) => !d.used && effFace(st, me, di, d.fi).t !== 'B').length;
      const abil = [CLASSES[P.cls].sig, ...abilitiesOf(P)].some(s => !(P.cast || []).includes(s) && P.charge >= sigCost(st, me, s) && abilityUsable(st, me, s));
      if (left || abil) { ui.confirmEnd = true; render(); } else dispatch({ t:'ready' });
      break;
    }
    case 'endnow': ui.confirmEnd = false; dispatch({ t:'ready' }); break;
    case 'keepgoing': ui.confirmEnd = false; render(); break;
    case 'unready': ui.confirmEnd = false; dispatch({ t:'unready' }); break;
    case 'desel': ui.sel = null; ui.confirmEnd = false; render(); break;
    case 'undo': dispatch({ t:'undo' }); break;
    case 'unpend': ui.pend = null; render(); break;
    case 'restart': dispatch({ t:'restart' }); break;
  }
}

// tooltips
const tipEl = $('tip');
function diePreview(p, di) {
  const P = st.players[p], d = P.dice[di];
  return `<b>${esc(dieName(P, di))}</b>${netHtml(effFaces(p, di), '3.2rem')}${d.gear.length ? `<div>${d.gear.map(g => GEAR[g].icon + ' ' + GEAR[g].name).join('<br>')}</div>` : ''}<div class="muted">Click to inspect each side</div>`;
}
document.addEventListener('mouseover', e => {
  const ins = e.target.closest('[data-inspect]');
  if (ins && st && screen === 'game') {
    const [ip, idi] = ins.dataset.inspect.split(':').map(Number);
    if (st.players[ip] && st.players[ip].dice[idi]) { tipEl.innerHTML = diePreview(ip, idi); tipEl.style.display = 'block'; return; }
  }
  const t = e.target.closest('[data-tip]');
  if (!t) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = t.dataset.tip; tipEl.style.display = 'block';
});
document.addEventListener('mousemove', e => {
  if (tipEl.style.display !== 'block') return;
  tipEl.style.left = Math.min(e.clientX + 14, innerWidth - tipEl.offsetWidth - 8) + 'px';
  tipEl.style.top = (e.clientY + 18 + tipEl.offsetHeight > innerHeight ? e.clientY - tipEl.offsetHeight - 10 : e.clientY + 18) + 'px';
});
document.addEventListener('focusin', e => {
  const t = e.target.closest('[data-tip]'); if (!t) return;
  const r = t.getBoundingClientRect(); tipEl.textContent = t.dataset.tip; tipEl.style.display = 'block';
  tipEl.style.left = Math.min(r.left, innerWidth - tipEl.offsetWidth - 8) + 'px'; tipEl.style.top = (r.bottom + 6) + 'px';
});
document.addEventListener('focusout', () => tipEl.style.display = 'none');

// exposed for the playtest harness
window.KC = { get st() { return st; }, set st(v) { st = v; }, act, botNext, newRun, addPlayer, dispatch, uiAction, CLASSES, RULES, GEAR, EQUIP };
render();
</script>
</body>
